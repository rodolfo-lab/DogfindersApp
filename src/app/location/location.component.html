<ion-card>

    @if(getLatitude() && getLongitude()){
      <ion-card>
        <ion-card-content>
          <div id="map"></div>
        </ion-card-content>
      </ion-card>
    }

    <!-- @if(getLoading()){
      <p>loading...</p>
    } -->

  @if (needsToFindLocation()) {
    <ion-card-content>
      <ion-button expand="block" (click)="findLocalization()">Pegar localização</ion-button>
    </ion-card-content>
  }

</ion-card>
