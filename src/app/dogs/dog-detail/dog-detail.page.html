<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>dog-detail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-img [src]="loadedDog.imageUrl"></ion-img>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-list>
          <ion-item>
            {{loadedDog.description}}
          </ion-item>

          <ion-item>
            Latitude: {{loadedDog.location.latitude}}
          </ion-item>

          <ion-item>
            Longitude: {{loadedDog.location.longitude}}
          </ion-item>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
