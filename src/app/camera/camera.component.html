<ion-card>
  <ion-card-content class="card-content">

    @if(image()){
      <img class="image" [src]="image()" style="width: 100%; margin-top: 16px; border-radius: 12px;" />
    }

    <ion-button expand="block"  (click)="takePicture()">
      Abrir câmera
    </ion-button>
  </ion-card-content>
</ion-card>
